<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <h1>Odin Calculator</h1>
    <div class="calculator">
        <div class="display">
          <div class="buffer"></div>
          <input type="text" value="" placeholder="0" readonly />
        </div>
        <div class="keyboard">
          <button class="all-clear" data-type="command" data-value="AC">AC</button>
          <button data-type="command" data-value="+/-">+/-</button>
          <button data-type="command" data-value="%">%</button>
          <button data-type="operator" data-value="/">/</button>
          <button data-type="digit" data-value="7">7</button>
          <button data-type="digit" data-value="8">8</button>
          <button data-type="digit" data-value="9">9</button>
          <button data-type="operator" data-value="*">*</button>
          <button data-type="digit" data-value="4">4</button>
          <button data-type="digit" data-value="5">5</button>
          <button data-type="digit" data-value="6">6</button>
          <button data-type="operator" data-value="-">-</button>
          <button data-type="digit" data-value="1">1</button>
          <button data-type="digit" data-value="2">2</button>
          <button data-type="digit" data-value="3">3</button>
          <button data-type="operator" data-value="+">+</button>
          <button class="grid-span-2" data-type="digit" data-value="0">0</button>
          <button class="dot" data-type="digit" data-value=".">.</button>
          <button class="equal-sign" data-type="command" data-value="=">=</button>
        </div>
      </div>
    
    <script src="javascript.js"></script>
</body>
</html>
