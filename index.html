<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <h1>Odin Calculator</h1>
    <div class="container">
        <div class="display">
            <p>12355fgtychjj</p>
        </div>
        <div class="calc-container">
            <div class="calc-row">
                <p>DEL</p>
                <p>%</p>
                <p>÷</p>
                <p>x</p>
            </div>
            <div class="calc-row">
                <p>7</p>
                <p>8</p>
                <p>9</p>
                <p>-</p>
            </div>
            <div class="calc-row">
                <p>4</p>
                <p>5</p>
                <p>6</p>
                <p>+</p>
            </div>
            <div class="calc-row">
                <p>1</p>
                <p>2</p>
                <p>3</p>
                <p>=</p>
            </div>
            <div class="calc-row">
                <p>0</p>
                <p>.</p>
                <p id="clear-button">C</p>
            </div>
        </div>
    </div>
    
</body>
</html>
