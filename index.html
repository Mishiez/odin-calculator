<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <h1>Odin Calculator</h1>
    <div class="container">
        <div class="display">
            <p id="display"></p>
        </div>
        <div class="calc-container">
            <div class="calc-row">
                <p><button value="del">DEL</button></p>
                <p><button class="operator" value="%">%</button></p>
                <p><button class="operator" value="÷">÷</button></p>
                <p><button class="operator" value="x">x</button></p>
            </div>
            <div class="calc-row">
                <p><button class="number" value="7">7</button></p>
                <p><button class="number" value="8">8</button></p>
                <p><button class="number" value="9">9</button></p>
                <p><button class="operator" value="-">-</button></p>
            </div>
            <div class="calc-row">
                <p><button class="number" value="4">4 </button></p>
                <p><button class="number" value="5">5</button></p>
                <p><button class="number" value="6">6</button></p>
                <p><button class="operator" value="+">+</button></p>
            </div>
            <div class="calc-row">
                <p><button class="number" value="1">1</button></p>
                <p><button class="number" value="2">2</button></p>
                <p><button class="number" value="3">3</button></p>
                <p><button class="operator" value="equal-sign">=</button></p>
            </div>
            <div class="calc-row">
                <p><button class="number" value="0">0</button></p>
                <p><button class="number" value=".">.</button></p>
                <p id="clear-button"><button value="clear">C</button></p>
            </div>
        </div>
    </div>
    
    <script src="javascript.js"></script>
</body>
</html>
